name: Rust
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: cargo build --release --locked --verbose
      - name: Verify binary
        run: |
          ls -lh target/release/
          file target/release/nio-swap-history-backend
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nio-swap-history-backend-linux-x86_64
          path: backend/target/release/nio-swap-history-backend
          if-no-files-found: error
