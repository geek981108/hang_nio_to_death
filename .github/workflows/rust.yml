name: Rust
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Build Release
        run: cargo build --locked --release --verbose
      - name: Verify binary
        run: |
          ls -lh target/release/nio-swap-history-backend
          file target/release/nio-swap-history-backend
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nio-swap-history-backend-linux-x86_64
          path: backend/target/release/nio-swap-history-backend
          if-no-files-found: error
